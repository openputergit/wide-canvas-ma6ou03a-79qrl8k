<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartCart - Self Checkout</title>
    <script src="https://unpkg.com/@zxing/library@latest"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .screen { display: none; }
        .active { display: block; }
        #scanner-container { position: relative; width: 100%; height: 300px; }
        #scanner-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 200px;
            height: 200px;
            border: 2px solid #4CAF50;
            box-shadow: 0 0 0 100vmax rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body class="bg-gray-100">
    <!-- Splash Screen -->
    <section id="splash" class="screen active h-screen flex items-center justify-center bg-white">
        <div class="text-center">
            <i class="bi bi-cart4 text-6xl text-green-500"></i>
            <h1 class="text-3xl font-bold mt-4">SmartCart</h1>
            <p class="text-gray-600 mt-2">Skip the queue, shop with ease</p>
        </div>
    </section>

    <!-- Login Screen -->
    <section id="login" class="screen p-6">
        <div class="max-w-md mx-auto bg-white rounded-xl shadow-md p-6">
            <h2 class="text-2xl font-bold mb-6">Login</h2>
            <div class="space-y-4">
                <input type="tel" placeholder="Phone Number" class="w-full p-3 border rounded-lg" id="phone-input">
                <button onclick="requestOTP()" class="w-full bg-green-500 text-white py-3 rounded-lg font-medium">
                    Get OTP
                </button>
                <div class="text-center">
                    <span class="text-gray-500">or</span>
                </div>
                <button onclick="googleSignIn()" class="w-full border border-gray-300 py-3 rounded-lg font-medium flex items-center justify-center gap-2">
                    <i class="bi bi-google"></i> Sign in with Google
                </button>
            </div>
        </div>
    </section>

    <!-- Home Screen -->
    <section id="home" class="screen p-6">
        <div class="max-w-md mx-auto">
            <h1 class="text-2xl font-bold mb-6">Welcome to SmartCart</h1>
            <div class="space-y-4">
                <button onclick="startScanning()" class="w-full bg-green-500 text-white p-4 rounded-lg flex items-center justify-center gap-2">
                    <i class="bi bi-upc-scan"></i> Start Scanning
                </button>
                <button onclick="viewCart()" class="w-full bg-blue-500 text-white p-4 rounded-lg flex items-center justify-center gap-2">
                    <i class="bi bi-cart"></i> View Cart
                </button>
                <button onclick="viewReceipts()" class="w-full bg-purple-500 text-white p-4 rounded-lg flex items-center justify-center gap-2">
                    <i class="bi bi-receipt"></i> My Receipts
                </button>
            </div>
        </div>
    </section>

    <!-- Scanner Screen -->
    <section id="scanner" class="screen">
        <div id="scanner-container">
            <video id="scanner-video"></video>
            <div id="scanner-overlay"></div>
        </div>
        <button onclick="goToHome()" class="fixed bottom-6 left-6 bg-white p-3 rounded-full shadow-lg">
            <i class="bi bi-arrow-left"></i>
        </button>
    </section>

    <!-- Product Detail Popup -->
    <div id="product-popup" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center p-6">
        <div class="bg-white rounded-lg p-6 w-full max-w-md">
            <h3 class="text-xl font-bold mb-4">Product Details</h3>
            <div class="space-y-4">
                <p id="product-name" class="text-lg">Product Name</p>
                <p id="product-price" class="text-green-600 font-bold">₹0.00</p>
                <div class="flex items-center gap-4">
                    <button onclick="updateQuantity(-1)" class="p-2 border rounded">-</button>
                    <span id="quantity">1</span>
                    <button onclick="updateQuantity(1)" class="p-2 border rounded">+</button>
                </div>
                <button onclick="addToCart()" class="w-full bg-green-500 text-white py-3 rounded-lg">
                    Add to Cart
                </button>
            </div>
        </div>
    </div>

    <!-- Cart Screen -->
    <section id="cart" class="screen p-6">
        <div class="max-w-md mx-auto">
            <h2 class="text-2xl font-bold mb-6">Shopping Cart</h2>
            <div id="cart-items" class="space-y-4"></div>
            <div class="border-t mt-6 pt-4">
                <div class="flex justify-between mb-4">
                    <span class="font-bold">Total:</span>
                    <span id="cart-total" class="font-bold">₹0.00</span>
                </div>
                <button onclick="checkout()" class="w-full bg-green-500 text-white py-3 rounded-lg">
                    Proceed to Checkout
                </button>
            </div>
        </div>
    </section>

    <!-- Payment Screen -->
    <section id="payment" class="screen p-6">
        <div class="max-w-md mx-auto">
            <h2 class="text-2xl font-bold mb-6">Payment</h2>
            <div class="bg-white rounded-lg p-6 shadow-md">
                <p class="text-lg mb-4">Amount to Pay:</p>
                <p class="text-3xl font-bold text-green-600 mb-6" id="payment-amount">₹0.00</p>
                <div class="space-y-4">
                    <button onclick="payWithUPI()" class="w-full bg-purple-500 text-white py-3 rounded-lg">
                        Pay with UPI
                    </button>
                    <button onclick="payWithCard()" class="w-full border border-gray-300 py-3 rounded-lg">
                        Pay with Card
                    </button>
                </div>
            </div>
        </div>
    </section>

    <!-- Success Screen -->
    <section id="success" class="screen p-6">
        <div class="max-w-md mx-auto text-center">
            <div class="bg-white rounded-lg p-6 shadow-md">
                <i class="bi bi-check-circle-fill text-5xl text-green-500"></i>
                <h2 class="text-2xl font-bold mt-4 mb-2">Payment Successful!</h2>
                <p class="text-gray-600 mb-6">Your order has been confirmed</p>
                <div id="qr-code" class="mx-auto w-48 h-48 bg-gray-200 mb-6"></div>
                <button onclick="goToHome()" class="w-full bg-green-500 text-white py-3 rounded-lg">
                    Back to Home
                </button>
            </div>
        </div>
    </section>

    <!-- Receipts Screen -->
    <section id="receipts" class="screen p-6">
        <div class="max-w-md mx-auto">
            <h2 class="text-2xl font-bold mb-6">My Receipts</h2>
            <div id="receipts-list" class="space-y-4"></div>
        </div>
    </section>

    <script>
        // Mock data
        let cart = [];
        let receipts = [];
        
        // Navigation functions
        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(screen => screen.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        // Simulate splash screen
        setTimeout(() => showScreen('login'), 2000);

        function requestOTP() {
            // Simulate OTP verification
            setTimeout(() => showScreen('home'), 1000);
        }

        function googleSignIn() {
            // Simulate Google sign in
            setTimeout(() => showScreen('home'), 1000);
        }

        function startScanning() {
            showScreen('scanner');
            // Initialize scanner
            const codeReader = new ZXing.BrowserMultiFormatReader();
            codeReader.decodeFromVideoDevice(null, 'scanner-video', (result) => {
                if (result) {
                    showProductPopup({
                        name: "Sample Product",
                        price: 99.99
                    });
                }
            });
        }

        function showProductPopup(product) {
            document.getElementById('product-popup').classList.remove('hidden');
            document.getElementById('product-name').textContent = product.name;
            document.getElementById('product-price').textContent = `₹${product.price}`;
        }

        function updateQuantity(change) {
            const quantityEl = document.getElementById('quantity');
            let quantity = parseInt(quantityEl.textContent) + change;
            if (quantity < 1) quantity = 1;
            quantityEl.textContent = quantity;
        }

        function addToCart() {
            // Add product to cart
            cart.push({
                name: document.getElementById('product-name').textContent,
                price: parseFloat(document.getElementById('product-price').textContent.slice(1)),
                quantity: parseInt(document.getElementById('quantity').textContent)
            });
            document.getElementById('product-popup').classList.add('hidden');
            updateCartView();
        }

        function updateCartView() {
            const cartItems = document.getElementById('cart-items');
            cartItems.innerHTML = '';
            let total = 0;

            cart.forEach((item, index) => {
                total += item.price * item.quantity;
                cartItems.innerHTML += `
                    <div class="flex justify-between items-center bg-white p-4 rounded-lg shadow">
                        <div>
                            <p class="font-medium">${item.name}</p>
                            <p class="text-gray-600">₹${item.price} × ${item.quantity}</p>
                        </div>
                        <button onclick="removeFromCart(${index})" class="text-red-500">
                            <i class="bi bi-trash"></i>
                        </button>
                    </div>
                `;
            });

            document.getElementById('cart-total').textContent = `₹${total.toFixed(2)}`;
            document.getElementById('payment-amount').textContent = `₹${total.toFixed(2)}`;
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            updateCartView();
        }

        function viewCart() {
            showScreen('cart');
            updateCartView();
        }

        function checkout() {
            showScreen('payment');
        }

        function payWithUPI() {
            // Simulate payment
            setTimeout(() => {
                receipts.push({
                    date: new Date().toLocaleDateString(),
                    amount: document.getElementById('payment-amount').textContent,
                    items: [...cart]
                });
                cart = [];
                showScreen('success');
            }, 1000);
        }

        function payWithCard() {
            // Similar to UPI payment
            payWithUPI();
        }

        function viewReceipts() {
            showScreen('receipts');
            const receiptsList = document.getElementById('receipts-list');
            receiptsList.innerHTML = '';
            
            receipts.forEach(receipt => {
                receiptsList.innerHTML += `
                    <div class="bg-white p-4 rounded-lg shadow">
                        <p class="font-medium">Date: ${receipt.date}</p>
                        <p class="text-green-600">Amount: ${receipt.amount}</p>
                        <p class="text-gray-600">${receipt.items.length} items</p>
                    </div>
                `;
            });
        }

        function goToHome() {
            showScreen('home');
        }
    </script>
<script>document.body.addEventListener('wheel', e => { if (!e.ctrlKey) return; e.preventDefault(); return }, { passive: false })</script>
	</body>
</html>
